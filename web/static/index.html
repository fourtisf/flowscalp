<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowScalp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0B0E11; --panel:#11161C; --text:#C9D4DF; --dim:#5C6873;
    --profit:#2EE6A6; --loss:#FF5C5C; --amber:#FFB02E; --line:#1C2530;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;font-size:13px;
       border-top:3px solid var(--amber);min-height:100vh}
  body.live{border-top-color:var(--loss)}
  .mono,td,th,.num{font-family:'JetBrains Mono',monospace}
  #gate{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px}
  #gate input{background:var(--panel);border:1px solid var(--line);color:var(--text);
              padding:10px 14px;font-family:'JetBrains Mono',monospace;width:320px;outline:none}
  #gate input:focus{border-color:var(--dim)}
  #gate .err{color:var(--loss);font-size:12px;height:14px}
  #app{display:none}
  #strip{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
         padding:10px 18px 6px;z-index:5}
  #strip .row{display:flex;align-items:baseline;gap:14px}
  #equity{font-size:34px;font-weight:700;letter-spacing:-.5px}
  #spark{width:100%;height:46px;display:block}
  .label{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.12em}
  main{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;padding:14px 18px;max-width:1480px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);padding:12px 14px}
  .c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:span 12}
  @media(max-width:900px){.c3,.c4,.c6{grid-column:span 12}}
  .big{font-size:22px;font-weight:600;margin-top:4px}
  .kv{display:flex;justify-content:space-between;margin-top:6px}
  .statrow{display:flex;gap:0;justify-content:space-between;flex-wrap:wrap}
  .statrow>div{padding:2px 8px 2px 0}
  .pos{color:var(--profit)} .neg{color:var(--loss)} .amb{color:var(--amber)}
  .badge{display:inline-block;padding:2px 8px;font-size:11px;font-weight:600;
         font-family:'JetBrains Mono',monospace;color:#0B0E11;background:var(--amber)}
  .badge.RUNNING{background:var(--profit)} .badge.STOPPED,.badge.HALTED_DAILY{background:var(--loss)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:var(--dim);font-weight:500;text-align:right;padding:4px 8px;border-bottom:1px solid var(--line);
     font-size:10px;text-transform:uppercase;letter-spacing:.1em}
  td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child,th.l,td.l{text-align:left}
  td.reason{max-width:380px;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
  .pulse{transition:color .15s}
  @media(prefers-reduced-motion:reduce){.pulse{transition:none}}
  #err{position:fixed;bottom:10px;right:14px;color:var(--loss);font-size:11px}
</style>
</head>
<body>
<div id="gate">
  <div class="label">flowscalp · dashboard token</div>
  <input id="tok" type="password" placeholder="DASH_BEARER_TOKEN" autocomplete="off">
  <div class="err" id="gateerr"></div>
</div>

<div id="app">
  <div id="strip">
    <div class="row">
      <span id="equity" class="mono num">—</span>
      <span class="label">equity</span>
      <span id="modebadge" class="badge">—</span>
      <span id="statebadge" class="badge">—</span>
      <span class="label" id="uptime"></span>
    </div>
    <canvas id="spark"></canvas>
  </div>
  <main>
    <div class="card c3"><div class="label">day pnl</div>
      <div class="big mono pulse" id="daypnl">—</div>
      <div class="kv"><span class="label">day R</span><span class="mono pulse" id="dayr">—</span></div>
      <div class="kv"><span class="label">mid</span><span class="mono pulse" id="mid">—</span></div>
    </div>
    <div class="card c6"><div class="label">summary · all time</div>
      <div class="statrow mono" style="margin-top:8px">
        <div><div class="label">trades</div><div id="s_trades">—</div></div>
        <div><div class="label">win rate</div><div id="s_wr">—</div></div>
        <div><div class="label">net R</div><div id="s_netr">—</div></div>
        <div><div class="label">PF</div><div id="s_pf">—</div></div>
        <div><div class="label">max DD</div><div id="s_dd">—</div></div>
        <div><div class="label">fees</div><div id="s_fees">—</div></div>
      </div>
      <div class="statrow mono" style="margin-top:10px">
        <div><div class="label">7d R</div><div id="s_7dr">—</div></div>
        <div><div class="label">7d pnl</div><div id="s_7dp">—</div></div>
        <div><div class="label">30d R</div><div id="s_30dr">—</div></div>
        <div><div class="label">30d pnl</div><div id="s_30dp">—</div></div>
      </div>
    </div>
    <div class="card c3"><div class="label">open position</div><div id="poscard" class="mono" style="margin-top:8px">flat</div></div>
    <div class="card c12"><div class="label">last 50 trades</div>
      <div style="overflow-x:auto;margin-top:6px"><table>
        <thead><tr><th class="l">time (utc)</th><th>side</th><th>entry</th><th>exit</th>
          <th>R</th><th>pnl $</th><th>exit</th><th class="l">reason</th></tr></thead>
        <tbody id="trades"></tbody>
      </table></div>
    </div>
  </main>
</div>
<div id="err"></div>

<script>
"use strict";
let TOKEN = null;            // memory only — never persisted
let chart = null;

const $ = id => document.getElementById(id);
function usd(x, signed=false){
  const s = Math.abs(x).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (x<0?"-":(signed?"+":"")) + "$" + s;
}
const px = x => x==null ? "—" : x.toLocaleString("en-US",{maximumFractionDigits:0});
function cls(el, v){ el.classList.toggle("pos", v>0); el.classList.toggle("neg", v<0); }
function setv(id, text){ const el=$(id); if(el.textContent!==text){ el.textContent=text; } return el; }

async function api(path){
  const r = await fetch(path, {headers:{Authorization:"Bearer "+TOKEN}});
  if(r.status===401) throw new Error("401");
  if(!r.ok) throw new Error("api "+r.status);
  return r.json();
}

async function refresh(){
  try{
    const [st, sum, trades, eq] = await Promise.all([
      api("/api/status"), api("/api/summary"), api("/api/trades?limit=50"), api("/api/equity?range=1d")
    ]);
    $("err").textContent = "";
    document.body.classList.toggle("live", st.mode==="live");
    setv("equity", usd(st.equity));
    $("modebadge").textContent = st.mode.toUpperCase();
    const sb=$("statebadge"); sb.textContent=st.state; sb.className="badge "+st.state;
    setv("uptime", "up "+Math.floor(st.uptime_min/60)+"h"+(st.uptime_min%60)+"m");
    cls(setv("daypnl", usd(st.day_pnl_usd, true)), st.day_pnl_usd);
    cls(setv("dayr", (st.day_r>=0?"+":"")+st.day_r.toFixed(2)+"R"), st.day_r);
    setv("mid", px(st.mid));

    const a=sum.all;
    setv("s_trades", String(a.trades));
    setv("s_wr", (a.win_rate*100).toFixed(0)+"%");
    cls(setv("s_netr", (a.net_r>=0?"+":"")+a.net_r.toFixed(1)+"R"), a.net_r);
    setv("s_pf", a.profit_factor==null?"—":a.profit_factor.toFixed(2));
    setv("s_dd", a.max_dd_pct.toFixed(1)+"%");
    setv("s_fees", usd(a.fees_usd));
    cls(setv("s_7dr",(sum["7d"].net_r>=0?"+":"")+sum["7d"].net_r.toFixed(1)+"R"), sum["7d"].net_r);
    cls(setv("s_7dp", usd(sum["7d"].pnl_usd,true)), sum["7d"].pnl_usd);
    cls(setv("s_30dr",(sum["30d"].net_r>=0?"+":"")+sum["30d"].net_r.toFixed(1)+"R"), sum["30d"].net_r);
    cls(setv("s_30dp", usd(sum["30d"].pnl_usd,true)), sum["30d"].pnl_usd);

    const p=st.open_position;
    $("poscard").innerHTML = !p ? '<span class="label">flat</span>' :
      `<div class="kv"><span>${p.side.toUpperCase()} ${p.size_btc.toFixed(4)} BTC</span>` +
      `<span class="${p.upnl_usd>=0?"pos":"neg"}">${usd(p.upnl_usd,true)}</span></div>` +
      `<div class="kv"><span class="label">entry</span><span>${px(p.entry_px)}</span></div>` +
      `<div class="kv"><span class="label">sl / tp</span><span>${px(p.sl_px)} / ${px(p.tp_px)}</span></div>` +
      `<div class="kv"><span class="label">in trade</span><span>${p.minutes}m</span></div>`;

    $("trades").innerHTML = trades.map(t=>{
      const d=new Date(t.ts_close).toISOString().slice(5,16).replace("T"," ");
      const rc=t.r_multiple>=0?"pos":"neg";
      return `<tr><td class="l">${d}</td><td>${t.side}</td><td>${px(t.entry_px)}</td>`+
        `<td>${px(t.exit_px)}</td><td class="${rc}">${t.r_multiple>=0?"+":""}${t.r_multiple.toFixed(2)}</td>`+
        `<td class="${rc}">${usd(t.pnl_usd,true)}</td><td>${t.exit_reason}</td>`+
        `<td class="l reason">${t.signal_reason||""}</td></tr>`;
    }).join("");

    const pts = eq.map(e=>({x:e.ts, y:e.equity}));
    if(!chart){
      chart = new Chart($("spark"), {type:"line",
        data:{datasets:[{data:pts, borderColor:"#2EE6A6", borderWidth:1.2, pointRadius:0, fill:false, tension:0}]},
        options:{animation:false, responsive:true, maintainAspectRatio:false,
          plugins:{legend:{display:false}, tooltip:{enabled:false}},
          scales:{x:{type:"linear",display:false},y:{display:false}}}});
    } else { chart.data.datasets[0].data = pts; chart.update("none"); }
  }catch(e){
    if(e.message==="401"){ showGate("token rejected"); return; }
    $("err").textContent = "fetch failed: "+e.message;
  }
}

function showGate(msg){
  TOKEN=null; $("app").style.display="none"; $("gate").style.display="flex";
  $("gateerr").textContent = msg||""; $("tok").value=""; $("tok").focus();
}

$("tok").addEventListener("keydown", async ev=>{
  if(ev.key!=="Enter") return;
  TOKEN = $("tok").value.trim();
  try{
    await api("/api/status");
    $("gate").style.display="none"; $("app").style.display="block";
    await refresh();
  }catch(e){ showGate(e.message==="401" ? "invalid token" : "api unreachable"); }
});

setInterval(()=>{ if(TOKEN) refresh(); }, 5000);
</script>
</body>
</html>
