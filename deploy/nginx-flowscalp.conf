# FlowScalp dashboard — serve at the VPS public IP (port 80) via nginx.
# NOTE: plain HTTP. The bearer token still gates all data and the API is
# read-only, but for HTTPS use the Cloudflare tunnel (/dashboard) or add a
# domain + certbot later.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
